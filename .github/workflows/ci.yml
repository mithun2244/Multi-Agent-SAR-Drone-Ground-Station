# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor: the codebase uses PEP 604 annotations (`float | None`)
        # in dataclass and Pydantic field positions, which are evaluated at class
        # creation and so need 3.10 or later at runtime, not just to parse.
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    # v7 of both: the Node 20 runtime the older majors target is deprecated and
    # was only being force-upgraded on the runner, which is a grace period
    # rather than a guarantee.
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install flake8
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Run the test suites
      # Not pytest: the suites are assert-based modules run with `python -m`, and
      # the packages deliberately have no __init__.py (namespace packages), so
      # pytest would import each test file top-level and its relative imports
      # would fail. Each command exits non-zero on failure, and the default shell
      # is `bash -e`, so the first failing suite fails the job.
      run: |
        python -m src.evaluation.test_evaluation
        python -m src.perception.test_perception
        python -m src.coordinator.test_coordinator
        python -m src.agents.test_agents
        python -m src.guardrails.test_guardrails
        python -m src.guardrails.test_adversarial
        python -m src.critic.test_critic
        python -m src.tuning.test_tuning
    - name: Ablation sanity checks
      # --selfcheck, not a full ablation sweep: it verifies the config and the
      # switches agree with the code, without spawning a process per run.
      run: python experiments/run_ablation.py --selfcheck
